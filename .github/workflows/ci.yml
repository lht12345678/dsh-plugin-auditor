name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  syntax:
    name: Syntax & bundle check (esbuild)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install direct deps (no peer auto-install)
        run: pnpm install --ignore-scripts

      - name: esbuild bundle check (externalizes DSH peer deps)
        run: |
          pnpm exec esbuild src/index.ts --bundle --format=esm --platform=node \
            --external:node:* --external:@deepseek-ai/* --external:cordis --external:schemastery \
            --outfile=/tmp/auditor-bundle-check.mjs
          echo "bundle check OK"

  build-and-verify:
    name: Build + entry + auditDeep self-audit
    runs-on: ubuntu-latest
    needs: syntax
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install direct deps (no peer auto-install)
        run: pnpm install --ignore-scripts

      - name: Compile src to lib (esbuild, types elided)
        run: |
          pnpm exec esbuild src/index.ts --bundle --format=esm --platform=node \
            --external:node:* --external:@deepseek-ai/* --external:cordis --external:schemastery \
            --external:acorn --external:acorn-walk \
            --outfile=lib/index.js
          echo "build OK"

      - name: Verify entry exports apply()
        run: |
          node --input-type=module -e "const m = await import('./lib/index.js'); if (typeof m.apply !== 'function') throw new Error('missing apply()'); console.log('OK:', m.name)"

      - name: Smoke-run audit engine on self
        run: |
          node --input-type=module -e "const { auditDeep } = await import('./lib/deepaudit.js'); const r = await auditDeep({ dir: '.', house: true, smokeTimeoutMs: 20000 }); console.log('deep self-audit:', r.verdict, '| ast files:', r.layers.ast.filesParsed, '| sandbox loadOk:', r.layers.sandbox.loadOk);"