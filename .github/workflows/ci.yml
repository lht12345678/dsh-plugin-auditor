name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  syntax:
    name: Syntax & bundle check (esbuild)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install direct and dev deps (peers skipped, DSH runtime provided)
        run: npm install --legacy-peer-deps --ignore-scripts --no-audit --no-fund

      - name: esbuild bundle check (externalizes DSH peer deps)
        run: |
          npx esbuild src/index.ts --bundle --format=esm --platform=node \
            --external:node:* --external:@deepseek-ai/* --external:cordis --external:schemastery \
            --external:acorn --external:acorn-walk \
            --outfile=/tmp/auditor-bundle-check.mjs
          echo "bundle check OK"

  build-and-verify:
    name: Build + entry + auditDeep self-audit
    runs-on: ubuntu-latest
    needs: syntax
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install direct and dev deps (peers skipped, DSH runtime provided)
        run: npm install --legacy-peer-deps --ignore-scripts --no-audit --no-fund

      - name: Compile src to lib (esbuild, types elided)
        run: |
          npx esbuild src/index.ts --bundle --format=esm --platform=node \
            --external:node:* --external:@deepseek-ai/* --external:cordis --external:schemastery \
            --external:acorn --external:acorn-walk \
            --outfile=lib/index.js
          npx esbuild src/deepaudit.ts --bundle --format=esm --platform=node \
            --external:node:* --external:acorn --external:acorn-walk \
            --outfile=lib/deepaudit.js
          echo "build OK"

      - name: Verify entry exports apply()
        run: |
          mkdir -p node_modules/@deepseek-ai/dsh-tools node_modules/@deepseek-ai/cordis-plugin-loader node_modules/schemastery
          echo '{"name":"@deepseek-ai/dsh-tools","version":"0.0.0","main":"index.js"}' > node_modules/@deepseek-ai/dsh-tools/package.json
          echo 'export const defineTool = (t) => t' > node_modules/@deepseek-ai/dsh-tools/index.js
          echo '{"name":"@deepseek-ai/cordis-plugin-loader","version":"0.0.0","main":"index.js"}' > node_modules/@deepseek-ai/cordis-plugin-loader/package.json
          echo 'export {}' > node_modules/@deepseek-ai/cordis-plugin-loader/index.js
          echo '{"name":"schemastery","version":"0.0.0","main":"index.js"}' > node_modules/schemastery/package.json
          printf 'const s = () => ({ default: (v) => v })\nexport default { object: (o) => o, union: s, const: s, boolean: s, array: s, string: s, number: s }\n' > node_modules/schemastery/index.js
          node --input-type=module -e "const m = await import('./lib/index.js'); if (typeof m.apply !== 'function') throw new Error('missing apply()'); console.log('OK:', m.name)"

      - name: Smoke-run audit engine on self
        run: |
          node --input-type=module -e "const { auditDeep } = await import('./lib/deepaudit.js'); const r = await auditDeep({ dir: '.', house: true, smokeTimeoutMs: 20000 }); console.log('deep self-audit:', r.verdict, '| ast files:', r.layers.ast.filesParsed, '| sandbox loadOk:', r.layers.sandbox.loadOk);"