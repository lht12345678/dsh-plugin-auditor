name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --ignore-scripts

      - name: Type check
        run: pnpm run typecheck

  build:
    name: Build (tsc)
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --ignore-scripts

      - name: Compile src to lib
        run: pnpm exec tsc -p tsconfig.json

      - name: Verify entry exports apply()
        run: |
          node --input-type=module -e "const m = await import('./lib/index.js'); if (typeof m.apply !== 'function') throw new Error('missing apply()'); console.log('OK:', m.name)"

      - name: Smoke-run audit engine on self
        run: |
          node --input-type=module -e "const { auditDeep } = await import('./lib/deepaudit.js'); const r = await auditDeep({ dir: '.', house: true, smokeTimeoutMs: 20000 }); console.log('deep self-audit:', r.verdict, '- host deps ok, sandbox ok');"